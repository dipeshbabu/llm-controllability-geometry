[project]
name = "llm-controllability-geometry"
version = "0.1.0"
description = "Behavior-preserving reachability, controllability, and monitor-invariance experiments for language models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Dipesh Babu" }
]
dependencies = [
  "accelerate>=0.27",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=5.13,<6",
]

[project.scripts]
llm-controllability = "llm_controllability.cli:main"

[project.optional-dependencies]
remote = [
  "boto3>=1.34",
  "datasets>=2.18",
  "modal>=0.64",
  "s3fs>=2024.2",
]
scope = [
  "sae-lens>=6.46,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_controllability*"]
